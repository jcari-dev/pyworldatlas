name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release toolchain
        run: python -m pip install -r docs/requirements.txt "build>=1.2,<2" "setuptools>=77" -e . -e pipeline -e packages/mapview -e packages/mapdata-overview -e packages/mapdata-standard
      - name: Prepare release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python maintain.py prepare-release "$VERSION"
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@v5
        with:
          name: pypi-core-distributions
          path: |
            dist/pyworldatlas-*.whl
            dist/pyworldatlas-*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: pypi-mapview-distributions
          path: |
            dist/pyworldatlas_mapview-*.whl
            dist/pyworldatlas_mapview-*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: pypi-mapdata-overview-distributions
          path: |
            dist/pyworldatlas_mapdata_overview-*.whl
            dist/pyworldatlas_mapdata_overview-*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: pypi-mapdata-standard-distributions
          path: |
            dist/pyworldatlas_mapdata_standard-*.whl
            dist/pyworldatlas_mapdata_standard-*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: release-metadata
          path: |
            dist/release-manifest.json
            dist/SHA256SUMS

  publish-pypi-core:
    name: Publish core package to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyworldatlas
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: pypi-core-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-pypi-mapview:
    name: Publish map viewer to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-mapview
      url: https://pypi.org/p/pyworldatlas-mapview
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: pypi-mapview-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-pypi-mapdata-overview:
    name: Publish overview map data to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-maps-overview
      url: https://pypi.org/p/pyworldatlas-mapdata-overview
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: pypi-mapdata-overview-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-pypi-mapdata-standard:
    name: Publish standard map data to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-maps-standard
      url: https://pypi.org/p/pyworldatlas-mapdata-standard
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: pypi-mapdata-standard-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs:
      - build
      - publish-pypi-core
      - publish-pypi-mapview
      - publish-pypi-mapdata-overview
      - publish-pypi-mapdata-standard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist
      - uses: actions/download-artifact@v6
        with:
          name: release-metadata
          path: metadata
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* metadata/* --generate-notes --verify-tag

  deploy-docs:
    name: Deploy documentation
    needs:
      - build
      - publish-pypi-core
      - publish-pypi-mapview
      - publish-pypi-mapdata-overview
      - publish-pypi-mapdata-standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist
      - name: Install documentation toolchain
        run: python -m pip install -r docs/requirements.txt
      - name: Build documentation from the released wheel
        run: python maintain.py docs --wheel dist/pyworldatlas-*.whl
      - name: Check out documentation repository
        uses: actions/checkout@v6
        with:
          repository: jcari-dev/pyworldatlas-documentation
          token: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          path: documentation-site
      - name: Publish generated HTML
        run: |
          rsync --archive --delete --exclude=.git docs/_build/html/ documentation-site/
          touch documentation-site/.nojekyll
          git -C documentation-site config user.name "github-actions[bot]"
          git -C documentation-site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C documentation-site add --all
          if git -C documentation-site diff --cached --quiet; then
            echo "Documentation is already current."
          else
            git -C documentation-site commit -m "Deploy PyWorldAtlas ${GITHUB_REF_NAME}"
            git -C documentation-site push
          fi
