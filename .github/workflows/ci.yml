name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on Linux, plus the oldest and newest on Windows
        # and macOS. Standard GitHub-hosted runners are free for public repos.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - {os: windows-latest, python-version: "3.10"}
          - {os: windows-latest, python-version: "3.14"}
          - {os: macos-latest, python-version: "3.10"}
          - {os: macos-latest, python-version: "3.14"}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime and builder
        run: python -m pip install -e . -e pipeline
      - name: Run tests
        run: python maintain.py test

  quality-gate:
    name: Wheel, examples, and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development toolchain
        run: python -m pip install -r docs/requirements.txt "build>=1.2,<2" "setuptools>=77" -e . -e pipeline
      - name: Run complete quality gate
        run: python maintain.py check
