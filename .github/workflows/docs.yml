name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - "packages/mapview/**"
      - "src/pyworldatlas/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-site
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documentation toolchain
        run: python -m pip install -r docs/requirements.txt -e . -e packages/mapview -e packages/mapdata-overview -e packages/mapdata-standard
      - name: Build and test documentation
        run: python maintain.py docs
      - name: Check published package version
        id: pypi
        shell: bash
        run: |
          VERSION="$(python -c 'import pyworldatlas; print(pyworldatlas.__version__)')"
          if python -c "import urllib.request; urllib.request.urlopen('https://pypi.org/pypi/pyworldatlas/${VERSION}/json', timeout=15)"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "PyWorldAtlas ${VERSION} is not published yet; the release workflow will deploy these docs after publication."
          fi
      - name: Check out documentation repository
        if: steps.pypi.outputs.published == 'true'
        uses: actions/checkout@v6
        with:
          repository: jcari-dev/pyworldatlas-documentation
          token: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          path: documentation-site
      - name: Publish generated HTML
        if: steps.pypi.outputs.published == 'true'
        run: |
          rsync --archive --delete --exclude=.git docs/_build/html/ documentation-site/
          touch documentation-site/.nojekyll
          git -C documentation-site config user.name "github-actions[bot]"
          git -C documentation-site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C documentation-site add --all
          if git -C documentation-site diff --cached --quiet; then
            echo "Documentation is already current."
          else
            git -C documentation-site commit -m "Deploy PyWorldAtlas documentation"
            git -C documentation-site push
          fi
