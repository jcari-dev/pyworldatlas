[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyworldatlas-mapdata-standard"
version = "0.9.2"
description = "Standard global map data for PyWorldAtlas"
readme = "README.md"
requires-python = ">=3.10"
license = "CC0-1.0"
authors = [{name = "jcari-dev"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Documentation = "https://jcari-dev.github.io/pyworldatlas-documentation/maps.html"
Source = "https://github.com/jcari-dev/pyworldatlas"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyworldatlas_mapdata_standard = ["data/maps.sqlite3"]
