[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyworldatlas"
version = "0.9.5"
description = "Offline country profiles, physical geography, 3D maps, distances, and learning tools"
keywords = ["atlas", "classroom", "countries", "education", "geography", "learning", "offline", "world-data"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*"]
authors = [{name = "jcari-dev"}]
maintainers = [{name = "jcari-dev"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
pyworldatlas = "pyworldatlas.__main__:main"

[project.optional-dependencies]
# Kept so older install commands still work. Maps need no extra packages now;
# install map data with: pyworldatlas get maps
maps-overview = []
maps = []

[project.urls]
Homepage = "https://jcari-dev.github.io/pyworldatlas-documentation/"
Documentation = "https://jcari-dev.github.io/pyworldatlas-documentation/"
Source = "https://github.com/jcari-dev/pyworldatlas"
Issues = "https://github.com/jcari-dev/pyworldatlas/issues"
Changelog = "https://jcari-dev.github.io/pyworldatlas-documentation/changelog.html"
Policy = "https://jcari-dev.github.io/pyworldatlas-documentation/educational_principles.html"
Playground = "https://jcari-dev.github.io/pyworldatlas-documentation/playground.html"
Roadmap = "https://jcari-dev.github.io/pyworldatlas-documentation/roadmap.html"
Security = "https://github.com/jcari-dev/pyworldatlas/security/policy"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyworldatlas = ["data/atlas.sqlite3", "py.typed", "_pack_index.json"]

[tool.mypy]
strict = true
files = ["src/pyworldatlas"]

[[tool.mypy.overrides]]
# plotly is optional: only CountryMap.figure() uses it, when installed.
module = ["plotly", "plotly.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["src/pyworldatlas"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "RUF"]
# Geographic text intentionally uses primes, typographic quotes, and the
# multiplication sign; __all__ is grouped by topic rather than sorted.
ignore = ["RUF001", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"tests/test_maps.py" = ["E402"]
