[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyworldatlas"
version = "0.7.0"
description = "Offline country profiles, physical geography, and geographic tools for Python"
keywords = ["atlas", "countries", "education", "geography", "offline", "world-data"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*"]
authors = [{name = "jcari-dev"}]
maintainers = [{name = "jcari-dev"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://jcari-dev.github.io/pyworldatlas-documentation/"
Documentation = "https://jcari-dev.github.io/pyworldatlas-documentation/"
Source = "https://github.com/jcari-dev/pyworldatlas"
Issues = "https://github.com/jcari-dev/pyworldatlas/issues"
Changelog = "https://jcari-dev.github.io/pyworldatlas-documentation/changelog.html"
Policy = "https://jcari-dev.github.io/pyworldatlas-documentation/educational_principles.html"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyworldatlas = ["data/atlas.sqlite3"]
