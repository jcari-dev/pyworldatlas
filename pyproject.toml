[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyworldatlas"
version = "0.13.0"
description = "Offline world atlas for Python: 248 countries, 11 million places, statistics since 1960, and 3D maps, with zero dependencies"
keywords = ["atlas", "classroom", "countries", "education", "gazetteer", "geography", "learning", "maps", "offline", "places", "quiz", "statistics", "sunrise", "world-data"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND CC-BY-4.0 AND Unicode-3.0 AND CC0-1.0"
license-files = ["LICENSE", "licenses/*", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "jcari-dev"}]
maintainers = [{name = "jcari-dev"}]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.scripts]
pyworldatlas = "pyworldatlas.__main__:main"

[project.optional-dependencies]
# Kept so older install commands still work. Maps need no extra packages now;
# install map data with: pyworldatlas get maps
maps-overview = []
maps = []

[project.urls]
Homepage = "https://jcari-dev.github.io/pyworldatlas-documentation/"
Documentation = "https://jcari-dev.github.io/pyworldatlas-documentation/"
Source = "https://github.com/jcari-dev/pyworldatlas"
Issues = "https://github.com/jcari-dev/pyworldatlas/issues"
Changelog = "https://jcari-dev.github.io/pyworldatlas-documentation/changelog.html"
Policy = "https://jcari-dev.github.io/pyworldatlas-documentation/educational_principles.html"
Playground = "https://jcari-dev.github.io/pyworldatlas-documentation/playground.html"
Roadmap = "https://jcari-dev.github.io/pyworldatlas-documentation/roadmap.html"
Security = "https://github.com/jcari-dev/pyworldatlas/security/policy"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyworldatlas = ["data/atlas.sqlite3", "data/places.pwpl", "py.typed", "_pack_index.json"]

[tool.mypy]
strict = true
files = ["src/pyworldatlas"]

[[tool.mypy.overrides]]
# plotly is optional: only CountryMap.figure() uses it, when installed.
module = ["plotly", "plotly.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["src/pyworldatlas"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "RUF"]
# Geographic text intentionally uses primes, typographic quotes, and the
# multiplication sign; __all__ is grouped by topic rather than sorted.
ignore = ["RUF001", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"tests/test_maps.py" = ["E402"]
